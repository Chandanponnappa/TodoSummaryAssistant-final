services:
  backend:
    build:
      context: ./Backend/todo-summary-assistant
      dockerfile: Dockerfile
    image: todo-backend:local
    container_name: todo-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - todo-network

  frontend:
    build:
      context: ./Frontend/todo
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: "http://13.201.168.199:8080/api"
    image: todo-frontend:local
    container_name: todo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:8080"
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
